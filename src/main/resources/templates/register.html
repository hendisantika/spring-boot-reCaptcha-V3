<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <title>Insert title here</title>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" id="bootstrap-css" rel="stylesheet"/>
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
    <script async defer src="https://www.google.com/recaptcha/api.js"></script>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>EMPLOYEE REGISTER PAGE</h3>
        </div>
        <div class="card-body">
            <form method="POST" th:action="@{/employee/save}" th:object="${employee}">
                <div class="row">
                    <div class="col-2">
                        <label>NAME</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" th:field="*{name}" type="text"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-2">
                        <label>SALARY</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" th:field="*{salary}" type="text"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-2">

                        <label>ADDRESS</label>
                    </div>
                    <div class="col-4">
                        <input class="form-control" th:field="*{address}" type="text"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-2">
                        <label>VERIFY</label>
                    </div>
                    <div class="col-4">
                        <div class="g-recaptcha" data-sitekey="6Td675746ryghjgrmghrggfhDaR67">
                        </div>
                    </div>
                </div>
                <input class="btn btn-success" type="submit" value="Add Employee"/>
                | <a class="btn btn-info" th:href="@{/employee/all}">VIEW ALL</a>
            </form>
            <br/>
            <div th:if="${message!=null}">
                <span class="alert alert-danger" th:text="${message}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
