<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Edit Employee - reCAPTCHA V3</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script crossorigin="anonymous"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="'https://www.google.com/recaptcha/api.js?render=' + ${recaptchaSiteKey}"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            overflow: hidden;
            background: white;
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
        }

        .form-header h2 {
            color: white;
            margin: 0;
            font-weight: 600;
        }

        .form-header i {
            font-size: 3rem;
            color: white;
            margin-bottom: 15px;
        }

        .form-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-cancel {
            background: #6c757d;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(108, 117, 125, 0.3);
            color: white;
        }

        .btn-view {
            background: #28a745;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-view:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.3);
            color: white;
        }

        .alert-custom {
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .recaptcha-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .employee-id-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <div class="form-header">
            <i class="fas fa-user-edit"></i>
            <h2>Edit Employee</h2>
            <p class="mb-0 text-white-50">Update employee information with secure reCAPTCHA V3</p>
        </div>
        <div class="form-body">
            <div class="recaptcha-info">
                <i class="fas fa-shield-alt text-primary me-2"></i>
                <small class="text-muted">This form is protected by Google reCAPTCHA V3</small>
            </div>

            <div class="mb-4 text-center">
                <span class="text-muted">Employee ID: </span>
                <span class="employee-id-badge" th:text="${employee.id}"></span>
            </div>

            <form method="POST" th:action="@{/update}" th:object="${employee}">
                <input th:field="*{id}" type="hidden">

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user me-2 text-primary"></i>Employee Name
                    </label>
                    <input class="form-control" placeholder="Enter employee name" required th:field="*{name}"
                           type="text"/>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-dollar-sign me-2 text-success"></i>Salary
                    </label>
                    <input class="form-control" placeholder="Enter salary amount" required step="0.01"
                           th:field="*{salary}" type="number"/>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-map-marker-alt me-2 text-danger"></i>Address
                    </label>
                    <input class="form-control" placeholder="Enter employee address" required th:field="*{address}"
                           type="text"/>
                </div>

                <input id="recaptcha-token" name="recaptcha-token" type="hidden">

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <button class="btn btn-submit me-md-2" type="submit">
                        <i class="fas fa-save me-2"></i>Update Employee
                    </button>
                    <a class="btn btn-view me-md-2" th:href="@{/}">
                        <i class="fas fa-list me-2"></i>View All
                    </a>
                    <a class="btn btn-cancel" th:href="@{/}">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>

            <div th:if="${message != null}">
                <div class="alert alert-info alert-custom" th:if="${message == 'Employee updated!!'}">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${message}"></span>
                </div>
                <div class="alert alert-danger alert-custom" th:if="${message == 'Please Verify Captcha'}">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${message}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Check if grecaptcha is available
    if (typeof grecaptcha === 'undefined') {
        console.error('reCAPTCHA library not loaded');
        alert('reCAPTCHA failed to load. Please refresh the page.');
    } else {
        grecaptcha.ready(function () {
            console.log('reCAPTCHA ready, site key:', '[[${recaptchaSiteKey}]]');
            const form = document.querySelector('form');
            const submitBtn = document.querySelector('.btn-submit');

            // Verify reCAPTCHA is properly initialized
            if (!grecaptcha.execute) {
                console.error('reCAPTCHA execute function not available');
                return;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                console.log('Form submit event triggered');

                // Add loading state
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
                submitBtn.disabled = true;

                console.log('Executing reCAPTCHA...');
                grecaptcha.execute('[[${recaptchaSiteKey}]]', {action: 'submit'}).then(function (token) {
                    console.log('reCAPTCHA token received:', token);
                    console.log('Token length:', token ? token.length : 'null/undefined');

                    if (!token || token.trim() === '') {
                        console.error('Empty or invalid token received from reCAPTCHA');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        alert('Failed to get reCAPTCHA token. Please refresh and try again.');
                        return;
                    }

                    const tokenField = document.getElementById('recaptcha-token');
                    tokenField.value = token;
                    console.log('Token set in hidden field:', tokenField.value);
                    console.log('Field name:', tokenField.name);
                    console.log('Submitting form with token...');
                    form.submit();
                }).catch(function (error) {
                    console.error('reCAPTCHA error:', error);
                    // Reset button state on error
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    alert('reCAPTCHA verification failed: ' + error.message);
                });
            });
        });
    }
</script>
</body>
</html>
